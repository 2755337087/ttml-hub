name: 提交歌词
description: 提交歌词文件和歌曲信息，申请收录
title: "[歌词提交] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索歌词站，确认目录中尚未收录该歌曲，再提交准确的歌词文件直链。

        > **标题栏**：请在 `[歌词提交] ` 后面接着输入「歌曲标题 - 艺术家 - 专辑名称」，
        > **禁止删除 `[歌词提交]` 前缀**，否则无法自动校验。
        > 示例：`[歌词提交] 左转灯 (1000 Times+1) - 派伟俊, mac ova seas - 左转灯 (1000 Times+1)`
        >
        > 校验未通过时，直接在本 Issue 下回复 `/update 新直链` 即可重新提交，机器人会自动重新校验。

  - type: input
    id: lyric-url
    attributes:
      label: 歌词文件直链
      description: 请提供可以直接下载 TTML 歌词文件的链接。
      placeholder: https://example.com/lyrics.ttml
    validations:
      required: true
