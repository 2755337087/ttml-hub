name: 提交歌词
description: 提交歌词文件和歌曲信息，申请收录
title: "[歌词提交] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索歌词站，确认目录中尚未收录该歌曲，再提交准确的歌曲信息和歌词文件直链。

  - type: input
    id: song-info
    attributes:
      label: 歌曲标题 - 艺术家 - 专辑名称
      description: 请按“歌曲标题 - 艺术家 - 专辑名称”的格式填写。
      placeholder: 例如：左转灯 (1000 Times+1) - 派伟俊, mac ova seas - 左转灯 (1000 Times+1)
    validations:
      required: true

  - type: input
    id: lyric-url
    attributes:
      label: 歌词文件直链
      description: 请提供可以直接下载 TTML 歌词文件的链接。
      placeholder: https://example.com/lyrics.ttml
    validations:
      required: true
