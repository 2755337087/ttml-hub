name: 提交歌词
description: 提交歌词文件和歌曲信息，申请收录
title: "[歌词提交] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索歌词站，确认目录中尚未收录该歌曲，再提交准确的歌曲信息和歌词。

  - type: input
    id: song-info
    attributes:
      label: 歌曲标题 - 艺术家 - 专辑名称
      description: 请按“歌曲标题 - 艺术家 - 专辑名称”的格式填写。
      placeholder: 例如：左转灯 (1000 Times+1) - 派伟俊, mac ova seas - 左转灯 (1000 Times+1)
    validations:
      required: true

  - type: dropdown
    id: submit-method
    attributes:
      label: 提交方式
      description: 歌词内容较长（约超过 60KB）时建议使用直链。
      options:
        - 歌词文件直链
        - 手动输入歌词内容
    validations:
      required: true

  - type: input
    id: lyric-url
    attributes:
      label: 歌词文件直链
      description: 选择「歌词文件直链」时必填，链接需可直接下载 TTML 文件。
      placeholder: https://example.com/lyrics.ttml
    validations:
      required: false

  - type: textarea
    id: lyric-content
    attributes:
      label: 歌词内容
      description: 选择「手动输入歌词内容」时必填，将 TTML 文件全文粘贴到此处。
      placeholder: |
        <tt xmlns="http://www.w3.org/ns/ttml" ...>
          ...
        </tt>
      render: xml
    validations:
      required: false
