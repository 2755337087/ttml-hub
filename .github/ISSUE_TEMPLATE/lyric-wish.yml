name: 求歌词
description: 申请人工制作一首尚未收录的逐字 TTML 歌词
title: "[求歌词] "
body:
  - type: markdown
    attributes:
      value: |
        歌词为人工制作，仅支持以普通话为主要语言的音乐。请确认目录中尚未收录该歌曲后再提交。

  - type: input
    id: song-info
    attributes:
      label: 歌曲标题 - 艺术家 - 专辑名称
      description: 请按"歌曲标题 - 艺术家 - 专辑名称"的格式填写。
      placeholder: 例如：左转灯 (1000 Times+1) - 派伟俊, mac ova seas - 左转灯 (1000 Times+1)
    validations:
      required: true

  - type: input
    id: stream-link
    attributes:
      label: 流媒体音乐链接
      description: |
        请优先填写 Apple Music ID，同时支持 QQ 音乐、网易云音乐链接。
        已下架歌曲请备注并告知可下载的音频链接。
      placeholder: "例如：Apple Music ID: 1813826436，或网易云音乐 https://music.163.com/#/song?id=..."
    validations:
      required: true
