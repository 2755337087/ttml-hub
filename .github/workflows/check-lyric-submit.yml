name: 歌词提交校验机器人

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: check-lyric-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    # issues 事件: [歌词提交] 标题触发校验（仅标题变更的编辑跳过）
    # issue_comment 事件:
    #   - 管理员「即将入库」开头评论 -> 自动关闭
    #   - 管理员「审核未通过」开头评论 -> 标签改为「待更新」
    #   - issue 作者或管理员的「/update」开头评论 -> 重新校验
    if: >
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, '[歌词提交]') &&
       (github.event.action != 'edited' || !github.event.changes.title || github.event.changes.body)) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       ((github.event.comment.user.login == github.repository_owner && (startsWith(github.event.comment.body, '即将入库') || startsWith(github.event.comment.body, '审核未通过'))) ||
        (startsWith(github.event.comment.body, '/update') &&
         (github.event.comment.user.login == github.event.issue.user.login || github.event.comment.user.login == github.repository_owner))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 构建歌词索引（用于平台 ID 查重）
        if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/update'))
        run: node scripts/build-index.mjs

      - name: 运行歌词校验机器人
        run: node scripts/check-lyric-submit-bot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_COMMENT_BODY: ${{ github.event.comment.body }}
          INDEX_FILE: public/api/v1/songs.json
          COMMENT_ACTION: ${{ github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/update') && 'update' || startsWith(github.event.comment.body, '审核未通过') && 'reject' || 'close') || '' }}
