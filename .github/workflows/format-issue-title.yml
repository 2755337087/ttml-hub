name: 格式化 Issue 标题

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  format-title:
    if: startsWith(github.event.issue.title, '[歌词提交]') || startsWith(github.event.issue.title, '[歌词反馈]') || startsWith(github.event.issue.title, '[求歌词]')
    runs-on: ubuntu-latest
    steps:
      - name: 使用表单首字段设置标题
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const fieldsByPrefix = {
              "[歌词提交] ": { label: "歌曲标题 - 艺术家 - 专辑名称" },
              "[求歌词] ":   { label: "歌曲标题 - 艺术家 - 专辑名称" },
              "[歌词反馈] ": { label: "歌曲标题 - 艺术家 - 专辑" },
            };

            const prefix = Object.keys(fieldsByPrefix).find((p) =>
              issue.title.startsWith(p),
            );
            if (!prefix) {
              core.warning("未匹配到受支持的标题前缀，保留原 Issue 标题。");
              return;
            }
            const { label } = fieldsByPrefix[prefix];

            if (!body.includes("### " + label)) {
              core.warning("未找到对应表单的首字段，保留原 Issue 标题。");
              return;
            }

            const escapeRegExp = (value) => value.replace(/[\^$.*+?()[\]{}|]/g, "\\$&");
            const pattern = new RegExp(
              "### " + escapeRegExp(label) + "\\s*\\n+([\\s\\S]*?)(?=\\n### |$)",
              "i",
            );
            const match = body.match(pattern);
            const value = match?.[1]?.trim();
            if (!value) {
              core.warning("歌词表单的首字段为空，保留原 Issue 标题。");
              return;
            }

            const title = prefix + value;
            if (title === issue.title) return;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title,
            });
